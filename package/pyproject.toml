[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TwINFER"
dynamic = ["version"]
requires-python = ">=3.9"
authors = [
    { name = "Keerthana M Arun", email = "keerthana.01.arun@gmail.com" },
    { name = "Yuval Scher", email = "yuval.scher@northwestern.edu" }
]
description = "TwINFER is a package to infer gene regulatory networks and detect multiple cell states in a population by utilizing lineage information combined with gene expression data."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
# [2026-10-23 replaced: the list was empty]
# dependencies = [
#     # filled from environment.yml — see below
# ]
# Third-party imports of package/twinfer; tested with the versions in the comments.
dependencies = [
    "numpy",          # 2.2.0
    "pandas",         # 2.3.3
    "scipy",          # 1.13.1
    "numba",          # 0.61.2
    "matplotlib",     # 3.10.8
    "seaborn",        # 0.13.2
    "networkx",       # 3.6.1
    "adjustText",     # 1.3.0
    "joblib",         # 1.5.3
    "tqdm",           # 4.67.1
    "threadpoolctl",  # 3.6.0
    "scikit-learn",   # 1.7.2
]

[tool.setuptools.packages.find]
where = ["."]
include = ["twinfer*"]

[tool.setuptools.package-data]
twinfer = ["test_data/*.csv"]

[tool.setuptools.dynamic]
version = { file = ["__version__"] }