[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TwINFER"
dynamic = ["version"]
requires-python = ">=3.9"
authors = [
    { name = "Keerthana M Arun", email = "keerthana.01.arun@gmail.com" },
    { name = "Yuval Scher", email = "yuval.scher@northwestern.edu" }
]
description = "TwINFER is a package to infer gene regulatory networks and detect multiple cell states in a population by utilizing lineage information combined with gene expression data."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    # filled from environment.yml — see below
]

[tool.setuptools.packages.find]
where = ["."]
include = ["twinfer*"]

[tool.setuptools.package-data]
twinfer = ["test_data/*.csv"]

[tool.setuptools.dynamic]
version = { file = ["__version__"] }