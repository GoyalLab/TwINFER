# Build the documentation in docs/ with Sphinx and publish it on GitHub Pages (https://goyallab.github.io/TwINFER/).
# Repository settings -> Pages -> Source must be "GitHub Actions".
name: Documentation

on:
  push:
    branches: [TwINFER_v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # without Git LFS files: the docs do not need real_data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and the documentation tools
        run: pip install ./package -r docs/requirements.txt
      - name: Build the site
        run: sphinx-build -b html docs docs/_build/html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
