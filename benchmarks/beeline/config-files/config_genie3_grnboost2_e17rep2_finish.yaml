input_settings:

    input_dir : "inputs/network_sweep_final_20260824"

    # Finishes the 5 GENIE3 runs (labels 5-9) that job 4199642 didn't reach
    # before hitting its 1-hour time limit (TIMEOUT at 145/150 for both
    # GENIE3 and GRNBOOST2). GRNBOOST2 is now 150/150 (a later direct-Bash
    # attempt finished it) so it's excluded here -- GENIE3 only. That same
    # direct-Bash attempt tried GENIE3 too and failed all 10 runs with
    # Docker exit 137 (OOM) because running outside SLURM has no dedicated
    # memory allocation -- same mistake as the original network_sweep_final
    # OOM history. This config is submitted via run_genie3_e17rep2_finish.sh
    # (proper SLURM job, 32GB dedicated) instead.
    algorithms:
        - algorithm_id: "PIDC"
          image: "grnbeeline/pidc:base"
          should_run: [False]

        - algorithm_id: "GENIE3"
          image: "grnbeeline/arboreto:base"
          should_run: [True]

        - algorithm_id: "GRNBOOST2"
          image: "grnbeeline/arboreto:base"
          should_run: [False]

        - algorithm_id: "PPCOR"
          image: "grnbeeline/ppcor:base"
          should_run: [False]
          params:
              pVal: [0.01]

        - algorithm_id: "SCODE"
          image: "grnbeeline/scode:base"
          should_run: [False]
          params:
              z: [4]
              nIter: [200]
              nRep: [2]

        - algorithm_id: "SINCERITIES"
          image: "grnbeeline/sincerities:base"
          should_run: [False]
          params:
              nBins: [10]

        - algorithm_id: "LEAP"
          image: "grnbeeline/leap:base"
          should_run: [False]
          params:
              maxLag: [0.33]

        - algorithm_id: "SCSGL"
          image: "grnbeeline/scsgl:base"
          should_run: [False]
          params:
              pos_density: [0.45]
              neg_density: [0.45]
              assoc: ["correlation"]

        - algorithm_id: "PEARSON"
          image: "local"
          should_run: [False]

    datasets:
        - dataset_id: "grn_n6_e17_pos100_density_rep2"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

output_settings:
    # [2026-10-01 replaced by template placeholder (render_beeline_configs.py); was: output_dir: "/home/gzu5140/TwINFER_KA/analysis_data/synthetic_network_benchmark_20260824/beeline_inference"]
    output_dir: "${TWINFER_DATA_ROOT}/synthetic_network_benchmark_20260824/beeline_inference"
    experiment_id: ""
