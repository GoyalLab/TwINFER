input_settings:

    input_dir : "inputs/network_sweep_final_20260824"

    # PIDC only -- the original full-rerun job (config_networksweep_final_20260824.yaml,
    # run via run_networksweep_final_full_rerun.sh) loaded R and ruby modules for
    # PPCOR/SCODE but forgot `module load julia`, so every single PIDC run
    # failed silently ("cannot run julia: No such file or directory") --
    # confirmed 0/150 rankedEdges.csv written for PIDC, all other 4 algorithms
    # in that job (PPCOR, SCODE, SCSGL, PEARSON) completed fine. This config
    # reruns PIDC only, across all 15 datasets; see run_pidc_fix.sh for the
    # corrected module load.
    algorithms:
        - algorithm_id: "PIDC"
          image: "grnbeeline/pidc:base"
          should_run: [True]

        - algorithm_id: "GENIE3"
          image: "grnbeeline/arboreto:base"
          should_run: [False]

        - algorithm_id: "GRNBOOST2"
          image: "grnbeeline/arboreto:base"
          should_run: [False]

        - algorithm_id: "PPCOR"
          image: "grnbeeline/ppcor:base"
          should_run: [False]
          params:
              pVal: [0.01]

        - algorithm_id: "SCODE"
          image: "grnbeeline/scode:base"
          should_run: [False]
          params:
              z: [4]
              nIter: [200]
              nRep: [2]

        - algorithm_id: "SINCERITIES"
          image: "grnbeeline/sincerities:base"
          should_run: [False]
          params:
              nBins: [10]

        - algorithm_id: "LEAP"
          image: "grnbeeline/leap:base"
          should_run: [False]
          params:
              maxLag: [0.33]

        - algorithm_id: "SCSGL"
          image: "grnbeeline/scsgl:base"
          should_run: [False]
          params:
              pos_density: [0.45]
              neg_density: [0.45]
              assoc: ["correlation"]

        - algorithm_id: "PEARSON"
          image: "local"
          should_run: [False]

    datasets:
        - dataset_id: "grn_n6_e5_pos100_density_rep0"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

        - dataset_id: "grn_n6_e5_pos100_density_rep1"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

        - dataset_id: "grn_n6_e5_pos100_density_rep2"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

        - dataset_id: "grn_n6_e9_pos0_sign_ratio_rep0"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

        - dataset_id: "grn_n6_e9_pos0_sign_ratio_rep1"
