input_settings:

    input_dir : "inputs/network_sweep_final"

    # GENIE3 only -- rerun in place for the 4 datasets where the original
    # arboreto/Dask process was OOM-killed (SIGKILL, ~4GB resident at time of
    # kill -- see time.txt in each affected working_dir). Requesting generous
    # memory here (see run_genie3_ppcor_fix.sh) is the actual fix; nothing in
    # GENIE3Runner.py itself changed. Only these 4 datasets are targeted
    # (not all 15) to keep this rerun small and deliberate, since GENIE3 is
    # the one algorithm known to have failed under memory pressure.
    algorithms:
        - algorithm_id: "PIDC"
          image: "grnbeeline/pidc:base"
          should_run: [False]

        - algorithm_id: "GENIE3"
          image: "grnbeeline/arboreto:base"
          should_run: [True]

        - algorithm_id: "GRNBOOST2"
          image: "grnbeeline/arboreto:base"
          should_run: [False]

        - algorithm_id: "PPCOR"
          image: "grnbeeline/ppcor:base"
          should_run: [False]
          params:
              pVal: [0.01]

        - algorithm_id: "SCODE"
          image: "grnbeeline/scode:base"
          should_run: [False]
          params:
              z: [4]
              nIter: [200]
              nRep: [2]

        - algorithm_id: "SINCERITIES"
          image: "grnbeeline/sincerities:base"
          should_run: [False]
          params:
              nBins: [10]

        - algorithm_id: "LEAP"
          image: "grnbeeline/leap:base"
          should_run: [False]
          params:
              maxLag: [0.33]

        - algorithm_id: "SCSGL"
          image: "grnbeeline/scsgl:base"
          should_run: [False]
          params:
              pos_density: [0.45]
              neg_density: [0.45]
              assoc: ["correlation"]

        - algorithm_id: "PEARSON"
          image: "local"
          should_run: [False]

    datasets:
        - dataset_id: "grn_n6_e5_pos100_density_rep2"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

        - dataset_id: "grn_n6_e17_pos100_density_rep0"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

        - dataset_id: "grn_n6_e17_pos100_density_rep1"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

        - dataset_id: "grn_n6_e17_pos100_density_rep2"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

output_settings:
    # SAME output root as the currently-scored data (rerun IN PLACE). No
    # --skip-populated: the 9 previously-OOM-killed runs have an empty
    # output.txt/no rankedEdges.csv so they'd be picked up either way, but
    # omitting it also lets already-correct GENIE3 runs in these 4 datasets
    # be regenerated harmlessly (same source file already staged -> same
    # result) rather than silently trusted.
    # [2026-10-01 replaced by template placeholder (render_beeline_configs.py); was: output_dir: "/home/gzu5140/TwINFER_KA/analysis_data/synthetic_network_benchmark_06082026/beeline_inference"]
    output_dir: "${TWINFER_DATA_ROOT}/synthetic_network_benchmark_06082026/beeline_inference"
    experiment_id: ""
