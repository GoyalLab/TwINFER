input_settings:

    input_dir : "inputs"

    # LEAP is deliberately disabled here: its max_lag is specified as a
    # proportion of cell count, so the number of lag values it searches
    # scales with cells too -- at 12000 cells/dataset this becomes a
    # multi-hour-per-run bottleneck that blocks the rest of the sweep.
    # Run it separately (its own config/job) instead.
    algorithms:
        - algorithm_id: "PIDC"
          image: "grnbeeline/pidc:base"
          should_run: [True]

        - algorithm_id: "GENIE3"
          image: "grnbeeline/arboreto:base"
          should_run: [True]

        - algorithm_id: "GRNBOOST2"
          image: "grnbeeline/arboreto:base"
          should_run: [True]

        - algorithm_id: "PPCOR"
          image: "grnbeeline/ppcor:base"
          should_run: [True]
          params:
              pVal: [0.01]

        - algorithm_id: "SCODE"
          image: "grnbeeline/scode:base"
          should_run: [True]
          params:
              z: [4]
              nIter: [200]
              nRep: [2]

        # SINCERITIES needs >=5 distinct pseudotime values to bin into a time
        # series; twin_paired only ever has 2 (t_early/t_final) so it can't
        # run there at all. The spread scheme has 5 distinct steps for
        # GSD/HSC (right at the threshold) but only 4 for mCAD/VSC (still
        # below it) -- same situation as config_networksweep_sincerities.yaml,
        # scope this to eligible spread runs only in a separate config
        # rather than half-enabling it here.
        - algorithm_id: "SINCERITIES"
          image: "grnbeeline/sincerities:base"
          should_run: [False]
          params:
              nBins: [10]

        - algorithm_id: "LEAP"
          image: "grnbeeline/leap:base"
          should_run: [False]
          params:
              maxLag: [0.33]

        - algorithm_id: "SCSGL"
          image: "grnbeeline/scsgl:base"
          should_run: [True]
          params:
              pos_density: [0.45]
              neg_density: [0.45]
              assoc: ["correlation"]

        - algorithm_id: "PEARSON"
          image: "local"
          should_run: [True]

    datasets:
        - dataset_id: "GSD"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

        - dataset_id: "HSC"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

        - dataset_id: "mCAD"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

        - dataset_id: "VSC"
          should_run: [True]
          scan_run_subdirectories: True
          groundTruthNetwork: "GroundTruthNetwork.csv"

output_settings:
    # [2026-10-01 replaced by template placeholder (render_beeline_configs.py); was: output_dir: "/home/gzu5140/Keerthana_b1042/TwINFER/analysis_data/real_networks/beeline_inference"]
    output_dir: "${TWINFER_DATA_ROOT}/real_networks/beeline_inference"
    experiment_id: ""
